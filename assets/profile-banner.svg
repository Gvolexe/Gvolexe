<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Gvol</title>
  <desc id="d">Gvol: hosting infrastructure, networks and automation. AS218429. A small network graph in Catppuccin Mocha colours.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11111b"/>
      <stop offset="0.55" stop-color="#181825"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c2e7"/>
      <stop offset="0.5" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="0.33" stop-color="#89b4fa"/>
      <stop offset="0.66" stop-color="#94e2d5"/>
      <stop offset="1" stop-color="#a6e3a1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#313244"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="319" rx="18" fill="url(#bg)" stroke="#313244"/>
  <rect x="740" y="1" width="539" height="318" fill="url(#grid)"/>

  <!-- wordmark -->
  <text x="72" y="160" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="124" font-weight="800" letter-spacing="-4">Gvol</text>
  <rect x="78" y="182" width="300" height="5" rx="2.5" fill="url(#rule)"/>
  <text x="76" y="232" fill="#bac2de" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="31" font-weight="500">Hosting infrastructure, networks &amp; automation</text>
  <text x="77" y="274" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="21">
    <tspan fill="#fab387">AS218429</tspan><tspan fill="#6c7086">  /  </tspan><tspan fill="#94e2d5">IPv4 + IPv6</tspan><tspan fill="#6c7086">  /  </tspan><tspan fill="#89b4fa">github.com/Gvolexe</tspan>
  </text>

  <!-- network graph: links -->
  <g fill="none" stroke="#45475a" stroke-width="2.5" stroke-linecap="round">
    <path d="M830 96 L960 60"/>
    <path d="M830 96 L890 200"/>
    <path d="M960 60 L1080 116"/>
    <path d="M890 200 L1020 240"/>
    <path d="M1080 116 L1200 74"/>
    <path d="M1080 116 L1150 228"/>
    <path d="M1020 240 L1150 228"/>
    <path d="M960 60 L1020 240"/>
    <path d="M1200 74 L1150 228"/>
  </g>
  <!-- highlighted route -->
  <path d="M890 200 L1020 240 L1150 228 L1200 74" fill="none" stroke="url(#route)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nodes -->
  <circle cx="830" cy="96" r="11" fill="#1e1e2e" stroke="#94e2d5" stroke-width="3"/>
  <circle cx="960" cy="60" r="11" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="3"/>
  <circle cx="1080" cy="116" r="11" fill="#1e1e2e" stroke="#f9e2af" stroke-width="3"/>
  <circle cx="1020" cy="240" r="12" fill="#1e1e2e" stroke="#f5c2e7" stroke-width="3.5"/>
  <circle cx="1150" cy="228" r="12" fill="#1e1e2e" stroke="#cba6f7" stroke-width="3.5"/>
  <circle cx="1200" cy="74" r="12" fill="#1e1e2e" stroke="#89b4fa" stroke-width="3.5"/>
  <circle cx="890" cy="200" r="15" fill="#fab387"/>
  <circle cx="890" cy="200" r="25" fill="none" stroke="#fab387" stroke-width="2" opacity="0.45"/>
</svg>
