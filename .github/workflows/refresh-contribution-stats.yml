name: Refresh contribution card

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update-contribution-stats.py
      - .github/workflows/refresh-contribution-stats.yml

permissions:
  contents: write

concurrency:
  group: refresh-contribution-card
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh SVG
        run: python3 scripts/update-contribution-stats.py
      - name: Commit changed card
        run: |
          git add assets/contribution-stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution stats card'
          git push
