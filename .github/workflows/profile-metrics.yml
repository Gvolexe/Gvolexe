name: Refresh unified profile metrics

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-metrics.yml

permissions:
  contents: write

concurrency:
  group: unified-profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate profile stats, languages, streak and achievements
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Gvolexe
          filename: assets/profile-metrics.svg
          template: classic
          base: header, activity, repositories, metadata
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 8
          config_timezone: Europe/Athens
          config_order: base.header, base.activity, base.repositories, languages, isocalendar, achievements, base.metadata
          plugins_errors_fatal: yes
